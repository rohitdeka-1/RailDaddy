name: RailDaddy-Backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rohit
      POSTGRES_PASSWORD: rohit@1234
      POSTGRES_DB: raildaddy
    ports:
      - "127.0.0.1:5432:5432" #port mapping 
    # this is called port mapping
    # the first port is the host port and second port is the container port

    volumes:
      - postgres_data:/var/lib/postgresql/data
  

  redis:
    image: redis:latest
    container_name: raildaddy_redis
    ports:
      - "127.0.0.1:5174:6379"
    volumes:
      - redis_data:/data
  
  adminer:
    image: adminer:latest
    container_name: raildaddy_adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8000:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data: